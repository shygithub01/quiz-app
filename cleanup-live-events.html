<!DOCTYPE html>
<html>
<head>
  <title>Cleanup Live Events</title>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getDatabase, ref, get, remove } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

    // Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDGCGLYne5u6R7-l_L3cV8vZE_JYqLZ0bI",
      authDomain: "ai-quiz-app-5c6d3.firebaseapp.com",
      databaseURL: "https://ai-quiz-app-5c6d3-default-rtdb.firebaseio.com",
      projectId: "ai-quiz-app-5c6d3",
      storageBucket: "ai-quiz-app-5c6d3.firebasestorage.app",
      messagingSenderId: "809785597109",
      appId: "1:809785597109:web:c4e3e5e5e5e5e5e5e5e5e5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    async function cleanupAllLiveEvents() {
      try {
        const eventsRef = ref(db, 'liveEvents');
        const snapshot = await get(eventsRef);
        
        if (!snapshot.exists()) {
          document.getElementById('status').innerHTML = '<p style="color: green;">✅ No live events found in database</p>';
          return;
        }

        const events = snapshot.val();
        const eventIds = Object.keys(events);
        
        document.getElementById('status').innerHTML = `<p>Found ${eventIds.length} live events. Deleting...</p>`;

        // Delete all events
        for (const eventId of eventIds) {
          await remove(ref(db, `liveEvents/${eventId}`));
          await remove(ref(db, `eventParticipants/${eventId}`));
          await remove(ref(db, `eventAnswers/${eventId}`));
          await remove(ref(db, `eventLeaderboard/${eventId}`));
          
          document.getElementById('status').innerHTML += `<p>✅ Deleted event: ${eventId}</p>`;
        }

        document.getElementById('status').innerHTML += `<p style="color: green; font-weight: bold;">✅ All ${eventIds.length} live events deleted!</p>`;
      } catch (error) {
        document.getElementById('status').innerHTML = `<p style="color: red;">❌ Error: ${error.message}</p>`;
        console.error(error);
      }
    }

    // Make function available globally
    window.cleanupAllLiveEvents = cleanupAllLiveEvents;
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h1 {
      color: #667eea;
      margin-bottom: 20px;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.9;
    }
    #status {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 5px;
      min-height: 50px;
    }
    .warning {
      background: #fff3cd;
      border: 2px solid #ffc107;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cleanup Live Events</h1>
    
    <div class="warning">
      <strong>Warning:</strong> This will delete ALL live events from the Realtime Database, including:
      <ul>
        <li>All event data</li>
        <li>All participants</li>
        <li>All answers</li>
        <li>All leaderboards</li>
      </ul>
      <p><strong>This action cannot be undone!</strong></p>
    </div>

    <button onclick="cleanupAllLiveEvents()">Delete All Live Events</button>

    <div id="status">
      <p style="color: gray;">Click the button above to start cleanup...</p>
    </div>
  </div>
</body>
</html>
